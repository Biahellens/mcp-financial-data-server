[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-financial-data-server"
version = "0.1.0"
description = "MCP server that exposes tools for stock quotes and portfolio risk/return metrics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bianca Hellen" }]
dependencies = [
    "mcp>=2.0.0",
    "yfinance>=0.2.40",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
mcp-financial-data-server = "mcp_financial.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_financial"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# BLE001 (no blind `except Exception`) is intentionally not selected: every
# MCP tool in server.py must convert *any* failure into an {"error": ...}
# payload instead of crashing the tool call, by design.
